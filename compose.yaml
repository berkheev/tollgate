name: tollgate

# Two tollgate instances share one Redis to show that limits hold across
# replicas. Only the first one is published to the host.
x-tollgate: &tollgate
  build: .
  image: tollgate:dev
  environment:
    TOLLGATE_REDIS_URL: redis://redis:6379/0
    TOLLGATE_LOG_LEVEL: ${TOLLGATE_LOG_LEVEL:-info}
    TOLLGATE_FAILURE_MODE: ${TOLLGATE_FAILURE_MODE:-open}
  volumes:
    - ./config/tollgate.yaml:/etc/tollgate/tollgate.yaml:ro
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  tollgate:
    <<: *tollgate
    ports:
      - "${TOLLGATE_PORT:-8090}:8090"

  tollgate-2:
    <<: *tollgate

  redis:
    image: redis:7-alpine
    # Limiter state is short-lived and always has a TTL, so no persistence,
    # and under memory pressure drop the keys closest to expiring.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tollgate.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  loadtest:
    image: grafana/k6:1.2.0
    profiles: ["loadtest"]
    command: ["run", "/scripts/traffic.js"]
    environment:
      TARGETS: http://tollgate:8090,http://tollgate-2:8090
      DURATION: ${DURATION:-3m}
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - tollgate
      - tollgate-2
